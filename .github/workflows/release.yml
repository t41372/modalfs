# Builds everything for a version tag (v0.3.0) and attaches it to a draft
# release, for a person to read over and publish. The tag must match Version in
# internal/daemon/daemon.go, so the app never reports a different version than
# its download. Run by hand, it builds the same files and keeps them as the
# run's artifacts, to try before tagging.
#
# It builds without the Go and Bun caches, so nothing that another workflow run
# wrote to a cache can end up in a release.
#
# The Mac app is signed only ad hoc and isn't notarized, so macOS asks before
# opening it the first time (README, "Install").

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Only the job that drafts the release can write to the repository.
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          version=$(sed -n 's/^var Version = "\(.*\)"/\1/p' internal/daemon/daemon.go)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Version $version in internal/daemon/daemon.go"
            exit 1
          fi

  linux:
    needs: version
    # The Linux app links against the system's GTK, WebKit and glibc, so it
    # runs only on systems as new as the one it's built on. Built on the older
    # LTS, it runs on 24.04 and 26.04 alike; CI tests on the newest.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json
          no-cache: true
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just
      - run: just lint
      - run: just test
      - run: just cli
      - name: Linux desktop app
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          just linux-gui
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p out
          for t in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            d=modalfs-$VERSION-$t
            mkdir -p "$d" && cp "dist/modalfs-$t" "$d/modalfs" && cp LICENSE README.md "$d/"
            tar -czf "out/$d.tar.gz" "$d"
          done
          d=modalfs-gui-$VERSION-linux-amd64
          mkdir -p "$d" && cp dist/modalfs-gui "$d/" && cp LICENSE README.md "$d/"
          tar -czf "out/$d.tar.gz" "$d"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: out/*

  macos:
    needs: version
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json
          no-cache: true
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just
      - run: just app
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p out
          # ditto keeps the bundle's signature and extended attributes intact.
          ditto -c -k --sequesterRsrc --keepParent dist/modalfs.app "out/modalfs-$VERSION-macos.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: out/*

  release:
    needs: [version, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write # create the draft release and upload its files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "modalfs ${GITHUB_REF_NAME#v}" --generate-notes *
