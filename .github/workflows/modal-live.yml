name: Modal live

# Real Modal, every day: the contract tests (behaviour modalfs relies on
# that Modal doesn't document) and the end-to-end tests. A change on Modal's
# side shows up here before a user finds it.
#
# The tests create, fill and delete scratch volumes with the token in the
# MODAL_TOKEN_ID and MODAL_TOKEN_SECRET secrets of the modal-live environment.
# Only someone with write access can start a run: on main, or on a pull
# request's branch to test it before merging (gh workflow run "Modal live"
# --ref BRANCH). A token reaches every volume in its workspace, so use one
# from a workspace kept for testing, holding nothing you care about.

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modal-live

jobs:
  live:
    runs-on: macos-26
    timeout-minutes: 120
    environment: modal-live
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just
      - name: Modal profile from the secrets
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::Set MODAL_TOKEN_ID and MODAL_TOKEN_SECRET in the modal-live environment (Settings → Environments), with a token from a workspace kept for testing."
            exit 1
          fi
          umask 077
          printf '[ci]\ntoken_id = "%s"\ntoken_secret = "%s"\n' "$MODAL_TOKEN_ID" "$MODAL_TOKEN_SECRET" > ~/.modal.toml
      - name: Contract tests
        run: just test-modal-contract ci
      - name: End-to-end tests (real NFS mounts, real Modal)
        if: ${{ !cancelled() }}
        run: just test-e2e-live ci
